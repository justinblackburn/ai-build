---
# Settings shared by every host in this inventory.
# Passwords and keys are vault values: see ../../README.md in this folder.

# Red Hat subscription (vault values)
enable_subscription: true
is_vagrant: false
rhsm_org: "CHANGE_ME"
rhsm_key: "CHANGE_ME"

# Stable Diffusion is off by default.
stable_diffusion_enabled: false

# Service accounts (ollama, callguard) come from the users role's users_service_accounts default.
users: []

# NVIDIA driver: 615.71.09 from NVIDIA's RHEL 9 repo, pinned in roles/nvidia/defaults/main.yml.

# RAG stack. The database password is a vault value.
llm_rag_pg_user: aiuser
llm_rag_pg_password: "CHANGE_ME"
llm_rag_pg_database: ai_context
llm_rag_pg_port: 5432
llm_rag_pg_host: localhost
llm_rag_api_host_port: 19090
llm_rag_api_container_port: 8090
llm_rag_doc_path: /srv/docs
