---
# The inventory users plus the ollama and callguard service accounts from defaults (SCRUM-87).
- name: Combine the inventory users with the service accounts
  set_fact:
    users_all: "{{ users | default([]) + users_service_accounts }}"

- name: Ensure all user groups exist
  group:
    name: "{{ item.service_group | default(item.name) }}"
    system: "{{ item.system | default(false) }}"
  loop: "{{ users_all }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create user accounts
  user:
    name: "{{ item.name }}"
    password: "{{ item.password | default(omit) }}"
    shell: "{{ item.shell | default('/bin/bash') }}"
    comment: "{{ item.comment | default(omit) }}"
    groups: "{{ item.groups | default([]) }}"
    append: yes
    create_home: yes
    home: "{{ item.home | default('/home/' + item.name) }}"
    group: "{{ item.service_group | default(item.name) }}"
    system: "{{ item.system | default(false) }}"
  loop: "{{ users_all }}"
  loop_control:
    label: "{{ item.name }}"

- name: Set ownership of required directories
  file:
    path: "{{ item.1 }}"
    state: directory
    owner: "{{ item.0.name }}"
    group: "{{ item.0.service_group | default(item.0.name) }}"
    mode: "0755"
  with_subelements:
    - "{{ users_all }}"
    - directories
  loop_control:
    label: "{{ item.0.name }}: {{ item.1 }}"

- name: Ensure wheel group has sudo (but with password)
  copy:
    dest: /etc/sudoers.d/wheel_nopasswd
    content: '%wheel ALL=(ALL) ALL'
    mode: '0440'

- name: Check if loginctl exists
  stat:
    path: /bin/loginctl
  register: loginctl_bin

- name: Read lingering state for users that run podman
  command: loginctl show-user {{ item.name }} -p Linger --value
  register: users_linger_state
  changed_when: false
  failed_when: false
  when:
    - not item.system | default(false)
    - item.enable_podman | default(false)
  loop: "{{ users_all }}"

# Only the users whose lingering is off are changed, so a second run reports changed=0.
- name: Enable lingering for users where it is off
  command: loginctl enable-linger {{ item.item.name }}
  loop: "{{ users_linger_state.results | selectattr('stdout', 'defined') | selectattr('stdout', 'equalto', 'no') | list }}"
