---
- name: Converge podman role
  hosts: all
  gather_facts: true
  become: true
  vars:
    users:
      - name: podtest
        comment: "molecule test user"
        shell: /bin/bash
        enable_podman: true
  roles:
    # users first: the podman role writes rootless config for the users it is given.
    - role: users
    - role: podman
