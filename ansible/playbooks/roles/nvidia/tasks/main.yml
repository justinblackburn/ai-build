---
- name: Detect NVIDIA GPU
  command: lspci
  register: lspci_output
  changed_when: false
  when: not is_vagrant | default(false)

- name: Set fact if NVIDIA GPU is present
  set_fact:
    nvidia_gpu_present: "{{ 'NVIDIA' in lspci_output.stdout }}"
  when: not is_vagrant | default(false)

- name: NVIDIA Setup Block
  when:
    - not is_vagrant | default(false)
    - nvidia_gpu_present | default(false)
  block:

    # Only the force flag asks for a clean reinstall. A run never decides that from the state of the module
    # (a missing module used to trigger it, which removed the working driver).
    - name: Set the clean-reinstall flag from the force variable only
      ansible.builtin.set_fact:
        nvidia_clean_reinstall: "{{ nvidia_force_clean_reinstall | bool }}"

    - name: Remove NVIDIA packages for a forced clean reinstall
      ansible.builtin.dnf:
        name:
          - nvidia-driver*
          - kmod-nvidia*
          - akmod-nvidia*
          - xorg-x11-drv-nvidia*
          - nvidia-settings*
          - nvidia-modprobe*
          - nvidia-persistenced*
        state: absent
      become: true
      when: nvidia_clean_reinstall | bool

    - name: Remove stale NVIDIA artifacts for a forced clean reinstall
      ansible.builtin.shell: |
        set -euo pipefail
        rm -rf /usr/lib/modules/{{ ansible_kernel }}/extra/nvidia*
        rm -rf /var/lib/dkms/nvidia*
        rm -f /etc/modprobe.d/nvidia*.conf
      become: true
      when: nvidia_clean_reinstall | bool

    - name: Disable nouveau kernel module
      ansible.builtin.copy:
        dest: /etc/modprobe.d/blacklist-nouveau.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          blacklist nouveau
          options nouveau modeset=0
      become: true
      notify: Rebuild initramfs after nouveau blacklist

    - name: Check whether nouveau is loaded
      ansible.builtin.command: lsmod
      register: nouveau_loaded
      changed_when: false

    - name: Attempt to unload nouveau module (best effort, only when loaded)
      ansible.builtin.command: modprobe -r nouveau
      when: "'nouveau' in (nouveau_loaded.stdout | default(''))"
      register: nouveau_remove
      changed_when: nouveau_remove.rc == 0
      failed_when: nouveau_remove.rc not in [0, 1]
      become: true
      ignore_errors: true

    - name: Install kernel headers and dev tools (the DKMS build needs them)
      dnf:
        name:
          - kernel-devel
          - kernel-headers
          - gcc
          - make
        state: present

    - name: Import EPEL GPG key
      ansible.builtin.rpm_key:
        state: present
        key: "https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-{{ ansible_distribution_major_version }}"

    - name: Install EPEL
      ansible.builtin.dnf:
        name: "https://dl.fedoraproject.org/pub/epel/epel-release-latest-{{ nvidia_repo_el_version }}.noarch.rpm"
        state: present

    - name: Add the NVIDIA CUDA repo (driver source)
      ansible.builtin.get_url:
        url: "{{ nvidia_cuda_repo_url }}"
        dest: "/etc/yum.repos.d/cuda-rhel{{ nvidia_repo_el_version }}.repo"
        mode: '0644'
      become: true

    - name: Install the versionlock plugin so the driver version stays pinned
      ansible.builtin.dnf:
        name: python3-dnf-plugin-versionlock
        state: present

    - name: Install the pinned NVIDIA driver (userspace, nvidia-smi and libcuda, DKMS kernel module)
      ansible.builtin.dnf:
        name:
          - "nvidia-driver-{{ nvidia_driver_version }}"
          - "nvidia-driver-cuda-{{ nvidia_driver_version }}"
          - "nvidia-driver-cuda-libs-{{ nvidia_driver_version }}"
          - "kmod-nvidia-open-dkms-{{ nvidia_driver_version }}"
        state: present
        disable_gpg_check: false
      become: true

    - name: Lock the NVIDIA driver packages at the pinned version (dnf update leaves them alone)
      ansible.builtin.command: "dnf versionlock add nvidia-driver nvidia-driver-cuda nvidia-driver-cuda-libs kmod-nvidia-open-dkms"
      changed_when: false
      become: true

    - name: Ensure NVIDIA kernel arguments are set
      ansible.builtin.command: grubby --info=ALL
      register: nvidia_grubby_info
      changed_when: false
      become: true

    - name: Apply required kernel arguments for NVIDIA
      ansible.builtin.command: "grubby --update-kernel=ALL --args='{{ item }}'"
      loop: "{{ nvidia_kernel_args }}"
      become: true
      when: item not in nvidia_grubby_info.stdout

    - name: Add NVIDIA Container Toolkit repo
      ansible.builtin.get_url:
        url: "{{ nvidia_container_repo_url }}"
        dest: /etc/yum.repos.d/libnvidia-container.repo
      when: nvidia_install_container_toolkit | bool
      become: true

    - name: Install NVIDIA Container Toolkit
      ansible.builtin.dnf:
        name: nvidia-container-toolkit
        state: present
      when: nvidia_install_container_toolkit | bool
      become: true

    - name: Configure Podman to use NVIDIA runtime
      ansible.builtin.copy:
        dest: /etc/containers/containers.conf.d/nvidia.conf
        content: |
          [engine]
          runtime = "nvidia"
      when: nvidia_install_container_toolkit | bool
      become: true

    # - name: Trigger reboot to load NVIDIA drivers
    #   reboot:
    #     msg: "Rebooting to activate NVIDIA drivers"
    #     connect_timeout: 5
    #     reboot_timeout: 600
